services:
  api:
    build: .
    image: california-home-estimator
    ports:
      - "5000:5000"
    restart: unless-stopped

  streamlit:
    image: california-home-estimator
    command:
      - python
      - -m
      - streamlit
      - run
      - streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped
